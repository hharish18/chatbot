<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin login</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="login-page"><main class="login-card"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">E</span><span>Emerspark Assistant</span></a><p class="eyebrow">ADMIN PORTAL</p><h1>Manage your knowledge base.</h1><p class="muted">Sign in to add or remove answers used by the assistant.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" class="login-form"><label>Username<input name="username" required autofocus></label><label>Password<input type="password" name="password" required></label><button class="primary-button" type="submit">Sign in <span>↗</span></button></form><a class="back-link" href="{{ url_for('index') }}">← Back to assistant</a></main></body></html>
